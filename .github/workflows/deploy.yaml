name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      # bases-page is a locally-customized plugin (committed under .quartz/plugins).
      # npm's copy in node_modules is the unmodified upstream version, so it has
      # to be synced from the committed build on every install.
      - name: Sync customized bases-page build into node_modules
        run: cp -R .quartz/plugins/bases-page/dist/. node_modules/@quartz-community/bases-page/dist/

      - run: npx quartz build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
